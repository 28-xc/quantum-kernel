name: Lint-Markdown
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint-markdown-link:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check markdown links
      # markdown-link-check is pinned to an exact version below.
      run: | # zizmor: ignore[adhoc-packages]
        npm install -g markdown-link-check@3.14.2
        export NODE_PATH="$(npm root -g)"
        find . -name '*.md' -print0 | xargs -0 -P16 -n1 node .github/scripts/check-markdown-links.cjs .github/mlc_config.xml
